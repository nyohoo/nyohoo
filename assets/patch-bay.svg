<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">nyohoo / Patch Bay</title>
  <desc id="desc">Two guitar pedals represent Git Worktree Manager and MyFavoriteAlbums.</desc>
  <defs>
    <linearGradient id="panel" x2="0.9" y2="1"><stop stop-color="#242728"/><stop offset="1" stop-color="#111516"/></linearGradient>
    <linearGradient id="a" x2="0" y2="1"><stop stop-color="#bee3cc"/><stop offset="1" stop-color="#7fbe9b"/></linearGradient>
    <linearGradient id="b" x2="0" y2="1"><stop stop-color="#fbc5a0"/><stop offset="1" stop-color="#d88864"/></linearGradient>
    <pattern id="dot" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#d2dbd5" opacity=".12"/></pattern>
  </defs>
  <rect x="1" y="1" width="958" height="408" rx="22" fill="url(#panel)" stroke="#464c4d" stroke-width="2"/>
  <rect x="9" y="9" width="942" height="392" rx="17" fill="url(#dot)" stroke="#4c5352" stroke-width="1"/>
  <g fill="#4e5352" stroke="#747977">
    <circle cx="24" cy="24" r="5"/><circle cx="936" cy="24" r="5"/><circle cx="24" cy="386" r="5"/><circle cx="936" cy="386" r="5"/>
  </g>
  <g font-family="monospace" font-size="13" letter-spacing="2.2" fill="#bac3bd" font-weight="700">
    <text x="45" y="41">NYOHOO / SIDE PROJECTS</text><text x="915" y="41" text-anchor="end">SIGNAL PATH 01—02</text>
  </g>
  <text x="42" y="104" font-family="sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="#f4efe4">PATCH BAY</text>
  <text x="915" y="100" text-anchor="end" font-family="sans-serif" font-size="18" fill="#cbd2cc">Code on one channel. Music on the other.</text>
  <path d="M45 123H915" stroke="#68706c"/>
  <path d="M41 255H78 M442 255H518 M882 255H925" fill="none" stroke="#090c0d" stroke-width="13" stroke-linecap="round"/>
  <path d="M41 255H78 M442 255H518 M882 255H925" fill="none" stroke="#7c837d" stroke-width="4" stroke-linecap="round"/>
  <g font-family="sans-serif">
    <rect x="64" y="148" width="384" height="226" rx="19" fill="#0c1111" stroke="#424c47" stroke-width="2"/>
    <rect x="64" y="140" width="384" height="226" rx="18" fill="url(#a)" stroke="#c0deca" stroke-width="2"/>
    <rect x="74" y="150" width="364" height="206" rx="12" fill="none" stroke="#47755e" stroke-width="1.3"/>
    <text x="95" y="178" fill="#244736" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2.4">01 / DEV TOOLS</text>
    <text x="94" y="239" font-size="38" font-weight="900" letter-spacing="-1.8" fill="#12251c">WORKTREE</text>
    <text x="95" y="269" font-size="17" fill="#203d2e">One worktree per task.</text>
    <path d="M95 303H417" stroke="#47755e" stroke-width="1"/>
    <circle cx="108" cy="330" r="8" fill="#1c3829"/><circle cx="108" cy="330" r="4.5" fill="#baff93"/>
    <text x="125" y="335" font-family="monospace" font-size="13" fill="#244736" font-weight="700">GIT + CLAUDE CODE</text>
    <g transform="translate(391 216)" fill="#183326" stroke="#183326" stroke-width="2.5" stroke-linecap="round"><path d="M0 -10V18M0 3Q17 3 17 -10" fill="none"/><circle cy="-10" r="4"/><circle cy="18" r="4"/><circle cx="17" cy="-10" r="4"/></g>
    <circle cx="401" cy="330" r="14" fill="#b9d7c6" stroke="#335542" stroke-width="2"/><circle cx="401" cy="330" r="8" fill="#e9f2e7" stroke="#7c9d8d"/>
  </g>
  <g font-family="sans-serif">
    <rect x="512" y="148" width="384" height="226" rx="19" fill="#0c1111" stroke="#4e4441" stroke-width="2"/>
    <rect x="512" y="140" width="384" height="226" rx="18" fill="url(#b)" stroke="#ffcfb1" stroke-width="2"/>
    <rect x="522" y="150" width="364" height="206" rx="12" fill="none" stroke="#935a41" stroke-width="1.3"/>
    <text x="543" y="178" fill="#622f25" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2.4">02 / MUSIC APPS</text>
    <text x="542" y="239" font-size="38" font-weight="900" letter-spacing="-1.8" fill="#331b17">NINE RECORDS</text>
    <text x="543" y="269" font-size="17" fill="#572b24">Nine albums. One image.</text>
    <path d="M543 303H865" stroke="#935a41" stroke-width="1"/>
    <circle cx="556" cy="330" r="8" fill="#4e2a20"/><circle cx="556" cy="330" r="4.5" fill="#fff08b"/>
    <text x="573" y="335" font-family="monospace" font-size="13" fill="#622f25" font-weight="700">CLOUDFLARE + HONO</text>
    <g transform="translate(851 218)" fill="none" stroke="#622f25"><circle r="17" stroke-width="2.4"/><circle r="12" opacity=".64"/><circle r="6" stroke-width="1.5"/><circle r="2" fill="#622f25"/></g>
    <circle cx="849" cy="330" r="14" fill="#e6ae96" stroke="#703e31" stroke-width="2"/><circle cx="849" cy="330" r="8" fill="#ffe4d8" stroke="#b17c68"/>
  </g>
